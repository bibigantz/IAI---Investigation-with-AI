<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password &middot; IAI</title>
    <script>(function(){try{document.documentElement.setAttribute("data-theme", localStorage.getItem("iai_theme") || "dark");}catch(e){}})();</script>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="brand-logo" style="margin: 0 auto var(--sp-4);">IAI</div>
            <h1 class="auth-title">Set a new password</h1>
            <p class="auth-sub">
                {% if current_user and current_user.must_change_password %}
                You're signed in with the default account password. Set your own before continuing.
                {% else %}
                Choose a new password.
                {% endif %}
            </p>

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="post" class="auth-form">
                <div class="form-group">
                    <label class="form-label">New password (min. 8 characters)</label>
                    <input type="password" name="new_password" class="form-input" autofocus required minlength="8">
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm new password</label>
                    <input type="password" name="confirm_password" class="form-input" required minlength="8">
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Set password</button>
            </form>
        </div>
    </div>
</body>
</html>
